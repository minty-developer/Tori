<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tori 웹사이트</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <img class="profile" src="./Assets/images/Tori.jpg" alt="Tori 프로필 이미지">
        <div>
            <h1>Tori</h1>
            <small>A Discord Manage Bot</small>
        </div>
    </header>
    <hr class="div-line">
    <main>
        <h2 class="main-title">"테토는 빨간 미쿠 아니거든~!"</h2>
        <div class="cards">
            <div class="card">
                <h3>Tori란?</h3>
                <p>Tori는 디스코드 <a href="https://discord.gg/RkDG3xUxzA" target="_blank" rel="noopener noreferrer">ボカロ</a>서버 운영을 돕는 도우미 봇!</p>
            </div>
            <div class="card">
                <h3>Tori가 할 수 있는 일</h3>
                <ul>
                    <li>서버에서 일부 커맨드로 대화하기</li>
                    <li>출석체크로 포인트 벌기</li>
                    <li><em style="color: #666;">기타 등등...</em></li>
                </ul>
            </div>
        </div>
        <div class="faq">
            <h3>FAQ</h3>
            <ol>
                <li><strong>Q: 토리가 갑자기 오프라인이에요!</strong><br>A: 이 웹사이트에 들어오면 최소 50초 뒤에 깨어납니다!</li>
            </ol>
        </div>
    </main>
    <hr class="div-line">
    <footer>
        Made By Minty
    </footer>
</body>
</html>
